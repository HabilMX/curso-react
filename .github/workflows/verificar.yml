name: Verificar el curso

# Cada punto de control (programas/NN-*/revisor) se revisa con el linter de
# React, se prueba y se compila en cada cambio. Esta corrida es pública:
# cualquiera puede abrirla y ver el resultado de cada paso.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: programas/*/revisor/package-lock.json

      - name: El medidor de profundidad sabe fallar (control positivo)
        run: herramientas/autoprueba-medir-profundidad.sh

      - name: La profundidad se mide (piso de 3,000 palabras por lección, mediana de 4,000)
        run: herramientas/medir-profundidad.sh

      - name: Cada punto de control instala, pasa el linter, sus pruebas y compila
        run: |
          set -euo pipefail
          node --version
          npm --version
          revisados=0
          probados=0
          for revisor in $(find programas -mindepth 2 -maxdepth 2 -type d -name revisor | sort); do
            echo "::group::$revisor"
            tiene_pruebas=no
            if node -e 'process.exit(require(process.argv[1]).scripts?.test ? 0 : 1)' "$PWD/$revisor/package.json"; then
              tiene_pruebas=si
            fi
            (
              cd "$revisor"
              npm ci --no-audit --no-fund
              npm run lint
              if [ "$tiene_pruebas" = si ]; then
                npm test -- --reporter=default
              else
                echo "Este punto de control todavía no tiene pruebas (su lección no las enseña)."
              fi
              npm run build
            )
            if [ "$tiene_pruebas" = si ]; then probados=$((probados + 1)); fi
            revisados=$((revisados + 1))
            echo "::endgroup::"
          done
          if [ "$revisados" -eq 0 ]; then
            echo "No se encontró ningún punto de control: este paso no verificó nada."
            exit 1
          fi
          echo "Puntos de control revisados: $revisados (con pruebas: $probados)"

      - name: Nota sobre la revisión previa a publicar
        run: |
          echo "La revisión de material no publicable (rutas internas, nombres reservados,"
          echo "direcciones de la infraestructura) se corre ANTES de publicar, con la lista"
          echo "de patrones que vive en el repositorio de trabajo y no se publica."
